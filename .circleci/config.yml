version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - restore_cache:
          keys:
            - pip-cache-v1-{{ .Branch }}-{{ checksum "requirements.txt" }}
            - pip-cache-v1-{{ .Branch }}-
      - run:
          name: Install dependencies
          command: pip install -r requirements.txt
      - save_cache:
          key: pip-cache-v1-{{ .Branch }}-{{ checksum "requirements.txt" }}
          paths:
            - ~/.cache/pip
      - run:
          name: Run tests
          command: pytest -v

  lint:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - restore_cache:
          keys:
            - pip-cache-v1-{{ .Branch }}-{{ checksum "requirements.txt" }}
            - pip-cache-v1-{{ .Branch }}-
      - run:
          name: Install dependencies
          command: |
            pip install -r requirements.txt
            pip install black
      - save_cache:
          key: pip-cache-v1-{{ .Branch }}-{{ checksum "requirements.txt" }}
          paths:
            - ~/.cache/pip
      - run:
          name: Check code formatting
          command: black --check .

workflows:
  version: 2
  build-and-test:
    jobs:
      - test
      - lint